version: '3.8'
services:
  api:
    build: .
    ports:
      - "8000:8000"
    networks:
      - automata-net
    depends_on:
      - db
      - redis

  worker:
    build: .
    command: celery -A workers.celery_app worker --loglevel=info
    networks:
      - automata-net
    depends_on:
      - redis
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: automata
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - automata-net

  redis:
    image: redis:7
    networks:
      - automata-net

networks:
  automata-net:

volumes:
  pgdata:
